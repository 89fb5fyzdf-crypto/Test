name: Screening quotidien

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours vers 6h-7h (heure de Paris)
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]
    paths: ["docs/**", "config/**", "scripts/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collecter et scorer
        if: github.event_name != 'push'
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: node scripts/screen.mjs
      - name: Enregistrer les données
        if: github.event_name != 'push'
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Veille du $(TZ=Europe/Paris date +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
